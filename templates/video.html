<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.css" rel="stylesheet" />
    <title>Video Downloader</title>
    <link rel="icon" type="image/x-icon" href="/static/images/sssmcTamil.png">
    <link href="/static/css/tailwind.css" rel="stylesheet">
    <script src="/static/js/main.js" defer></script>
    <script src="https://cdn.jsdelivr.net/gh/Kagami/ffmpeg.js/ffmpeg-mp4.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@3.0.0/dist/flowbite.min.js"></script>
</head>
<body class="bg-gray-100">
    {% include 'sidebar.html' %}
    <div class="container mx-auto py-12 flex flex-col items-center justify-center">
        <h1 class="text-4xl font-bold text-center text-blue-600 mb-8">Infographics</h1>
        <blockquote id="quoteText">Select an Infographic</blockquote>
        <form id="channel-info" method="GET" action="/channel-info" style="display: none;">
            <input type="text" name="channel_id" class="p-2 border border-gray-300 rounded-md flex-grow" placeholder="Enter Channel ID">
            <input type="text" name="username" class="p-2 border border-gray-300 rounded-md flex-grow" placeholder="Enter Username (Optional)">
            <button id="videoBtn" type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Get Channel Info</button>
            <span id="videoIcon" class="hidden">
                <i class="fa-solid fa-circle-notch fa-spin fa-lg" style="color: #1D4ED8;"></i>
            </span>
        </form>
        <form id="video-info" method="GET" action="/video-info" style="display: none;">
            <input type="text" name="video_id" class="p-2 border border-gray-300 rounded-md flex-grow" placeholder="Enter video ID">
            <button id="videoBtn" type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Get Video Info</button>
            <span id="videoIcon" class="hidden">
                <i class="fa-solid fa-circle-notch fa-spin fa-lg" style="color: #1D4ED8;"></i>
            </span>
        </form>

        <div class="flex justify-center gap-4 mt-6">
            <button id="videoInfo" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition items-center">Video</button>
            <button id="channelInfo" class="bg-blue-500 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">Channel</button>
        </div>
    </div>

</body>
</html>
